  const sites=S.sites;
  if(!sites.length)return `<div class="page-head"><div><h1>Monitoring</h1></div></div><div class="card empty"><div class="ei">${I('shield',22)}</div><b>No websites yet</b><p>Add a website to configure monitoring.</p><button class="btn btn-primary" style="margin-top:14px" data-action="addSite">${I('plus',16)}Add Website</button></div>`;
  if(!sites.find(s=>s.id===protSite))protSite=sites[0].id;
  const s=sites.find(x=>x.id===protSite);
  return `<div class="page-head"><div><h1>Monitoring</h1><p>Choose what Shieldly checks and how often.</p></div><div class="acts"><button class="btn btn-primary" data-action="saveProtection">${I('check',16,2.2)}<span>Save changes</span></button></div></div>
  ${sites.length>1?`<div class="tabs">${sites.map(w=>`<button class="${w.id===s.id?'on':''}" data-action="pickSite" data-id="${w.id}"><span class="dot ${w.verified&&w.status==='active'&&w.health!=='down'?'ok':w.health==='down'?'high':''}"></span>${esc(w.domain)}</button>`).join('')}</div>`:''}
  ${!s.verified?`<div class="banner info">${I('shieldCheck',18)}<div class="grow"><b>${esc(s.domain)} is not verified yet.</b> These settings apply once monitoring starts.</div><button class="btn btn-primary btn-sm" data-go="#/app/websites/${s.id}">Verify now</button></div>`:''}
  <div class="card" style="margin-bottom:16px"><div class="set-row"><div class="l"><div class="fav">${esc(s.domain[0])}</div><div><b>${esc(s.domain)}</b><small>Monitoring is ${s.status==='active'?'active.':'paused — no checks are running.'}</small></div></div><div style="display:flex;align-items:center;gap:12px">${healthPill(s)}<label class="switch" title="Monitoring on/off"><input type="checkbox" data-change="siteStatus" ${s.status==='active'?'checked':''}><span></span></label></div></div></div>
  <div class="card"><div class="card-h"><div><h3>Checks</h3><p>Select what Shieldly should check on this website.</p></div></div><div class="card-b"><div class="area-grid" id="checks">${CHECK_OPTS.map(a=>`<button type="button" class="opt ${s.checks[a.id]?'on':''}" data-action="areaToggle" data-id="${a.id}"><span class="oi">${I(a.icon,17)}</span><span><b>${a.label}</b><small>${a.desc}</small></span><span class="ck">${I('check',11,3)}</span></button>`).join('')}</div></div></div>
  <div class="grid g2 mt"><div class="card"><div class="card-h"><div><h3>Check frequency</h3><p>How often Shieldly checks if your site is online.</p></div></div><div class="card-b"><div class="seg" id="interval" style="width:100%;display:flex">${[1,5,10,15,30,60].map(v=>`<button type="button" style="flex:1" class="${s.intervalMin===v?'on':''}" data-action="interval" data-v="${v}" ${v===1&&S.user.plan!=='pro'?'data-pro="1" title="Shieldly Pro"':''}>${v<60?v+'m':'1h'}${v===1&&S.user.plan!=='pro'?' '+I('lock',11):''}</button>`).join('')}</div><p class="hint" style="margin-top:8px">${S.user.plan==='pro'?'Pro: full security scans run every hour':'Full security scans run every 6 hours · <a data-go="#/app/plan" style="color:var(--blue);cursor:pointer">1-minute checks with Pro</a>'}</p></div></div>
  <div class="card"><div class="card-h"><div><h3>API endpoint</h3><p>Monitored together with your website.</p></div></div><div class="card-b"><div class="field"><label class="label" for="pr-api">API URL <small>Optional</small></label><input class="input" id="pr-api" placeholder="https://api.${esc(s.domain)}" value="${esc(s.apiUrl||'')}"></div>${s.reason?`<div class="field" style="margin-bottom:0"><label class="label">Monitoring goal</label><p class="hint" style="font-size:13.5px;color:var(--fg2)">“${esc(s.reason)}”</p></div>`:''}</div></div></div>`;
};
function estimate(interval,api){const perMonth=Math.round(43200/interval)*(1+(api?1:0))+4*30*10;return `This website uses about <b>${fmt(perMonth)}</b> credits per month at this setting.`}

let actF={q:'',sev:'all',site:'all',page:1};const PER=15;
PAGES.activity=async function(){
  const d=await api('GET','/events?limit=1');const c=d.counts||{};
  AUTORUN.actTable=()=>renderActivityTable();
  return `<div class="page-head"><div><h1>Activity</h1><p>Every security event across your websites.</p></div><div class="acts"><button class="btn btn-secondary" data-action="exportCsv">${I('download',16)}Export CSV</button></div></div>
  <div class="grid g3 keep2" style="margin-bottom:16px">${[['high','High severity'],['medium','Medium severity'],['low','Low severity']].map(x=>`<div class="card stat" style="cursor:pointer" data-action="sevFilter" data-v="${x[0]}"><div class="stat-top"><span class="stat-l">${x[1]}</span><span class="sev s-${x[0]}">${cap(x[0])}</span></div><div class="stat-v">${fmt(c[x[0]]||0)}</div><div class="stat-s">events · last 7 days</div></div>`).join('')}</div>
  <div class="card"><div class="toolbar"><div class="input-wrap search">${I('search',16)}<input class="input" id="af-q" placeholder="Search events…" value="${esc(actF.q)}"></div>
   <select class="input" id="af-sev"><option value="all">All severities</option>${['high','medium','low','info'].map(s=>`<option value="${s}" ${actF.sev===s?'selected':''}>${sevLabel(s)}</option>`).join('')}</select>
   <select class="input" id="af-site"><option value="all">All websites</option>${S.sites.map(s=>`<option value="${s.id}" ${actF.site===s.id?'selected':''}>${esc(s.domain)}</option>`).join('')}</select></div>
   <div id="act-table" data-autorun="actTable"><div style="padding:20px">${'<div class="skel" style="height:40px;margin-bottom:10px"></div>'.repeat(5)}</div></div></div>`;
};
function actQuery(){const p=new URLSearchParams();if(actF.q)p.set('q',actF.q);if(actF.sev!=='all')p.set('severity',actF.sev);if(actF.site!=='all')p.set('site',actF.site);return p}
let actSeq=0;
async function renderActivityTable(){
  const box=$('#act-table');if(!box)return;const seq=++actSeq;
  const p=actQuery();p.set('page',actF.page);p.set('limit',PER);
  let d;try{d=await api('GET','/events?'+p)}catch(e){box.innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}
  if(seq!==actSeq||!box.isConnected)return;
  const pages=Math.max(1,Math.ceil(d.total/PER));
  if(!d.events.length){box.innerHTML=`<div class="empty"><div class="ei">${I('search',20)}</div><b>No events found</b>${actF.q||actF.sev!=='all'||actF.site!=='all'?'Try a different search or filter.':'Events appear here as soon as Shieldly starts checking your websites.'}</div>`;return}
  box.innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Event</th><th>Website</th><th>Severity</th><th>Type</th><th>Time</th></tr></thead><tbody>${d.events.map(e=>{EVCACHE[e.id]=e;return `<tr data-action="eventDetail" data-id="${e.id}"><td data-label="Event"><div class="ev"><span class="ev-ic s-${e.severity}">${I(evIcon(e),16)}</span><div style="min-width:0"><b>${esc(e.title)}</b>${e.detail?`<small style="font-family:var(--font)">${esc(e.detail)}</small>`:''}</div></div></td><td data-label="Website">${esc(e.domain||'—')}</td><td data-label="Severity"><span class="sev s-${e.severity}">${sevLabel(e.severity)}</span></td><td data-label="Type"><span class="tag">${esc(TYPE_LABEL[e.type]||e.type)}</span></td><td data-label="Time" style="white-space:nowrap" class="muted" title="${esc(fullDate(e.ts))}">${rel(e.ts)}</td></tr>`}).join('')}</tbody></table></div>
  <div class="pager"><span>Showing ${(actF.page-1)*PER+1}–${Math.min(actF.page*PER,d.total)} of ${fmt(d.total)} events</span><div class="b"><button class="btn btn-secondary btn-sm" data-action="page" data-d="-1" ${actF.page<=1?'disabled':''}>${I('chevLeft',14)}Prev</button><button class="btn btn-secondary btn-sm" data-action="page" data-d="1" ${actF.page>=pages?'disabled':''}>Next${I('chevRight',14)}</button></div></div>`;
}
const TYPE_LABEL={down:'Downtime',up:'Recovery',api_down:'API downtime',api_up:'API recovery',finding:'Security issue',resolved:'Resolved',scan:'Scan',verified:'Verification',site_added:'Website',site_removed:'Website',paused:'Monitoring',resumed:'Monitoring',credits:'Credits'};

let anRange='7d',anSite='all';
PAGES.analytics=async function(){
  const d=await api('GET',`/analytics?range=${anRange}${anSite!=='all'?'&site='+anSite:''}`);const L=bucketLabels(d);
  const all=d.site.map((b,i)=>({checks:b.checks+d.api[i].checks,fails:b.fails+d.api[i].fails}));
  const totalChecks=all.reduce((a,b)=>a+b.checks,0),totalFails=all.reduce((a,b)=>a+b.fails,0);
  const sc=d.site.reduce((a,b)=>a+b.checks,0),sf=d.site.reduce((a,b)=>a+b.fails,0);
  const upt=sc?100*(sc-sf)/sc:null;
  const msVals=d.site.filter(b=>b.avg_ms!=null);const avgMs=msVals.length?Math.round(msVals.reduce((a,b)=>a+b.avg_ms*b.checks,0)/Math.max(1,msVals.reduce((a,b)=>a+b.checks,0))):null;
  const issues=d.events.reduce((a,b)=>a+b.high+b.medium+b.low,0);
  const hasApi=d.api.some(b=>b.checks);const lbl={'24h':'last 24 hours','7d':'last 7 days','30d':'last 30 days'}[anRange];
  const cat=d.categories;const parts=[{n:'SSL & HTTPS',v:cat.ssl,c:'#2563ff'},{n:'Security headers',v:cat.headers,c:'#7ea3ff'},{n:'Email / DNS',v:cat.dns,c:'#f59e0b'},{n:'API',v:cat.api,c:'#10b981'},{n:'Other',v:cat.other,c:'#d4d4dc'}];
  return `<div class="page-head"><div><h1>Analytics</h1><p>Monitoring insights for the ${lbl}.</p></div><div class="acts">${S.sites.length>1?`<select class="input" id="an-site" style="height:38px;width:auto"><option value="all">All websites</option>${S.sites.map(s=>`<option value="${s.id}" ${anSite===s.id?'selected':''}>${esc(s.domain)}</option>`).join('')}</select>`:''}<div class="seg">${['24h','7d','30d'].map(r=>`<button class="${anRange===r?'on':''}" data-action="range" data-v="${r}">${r.toUpperCase()}</button>`).join('')}</div></div></div>
  <div class="grid g4 keep2">${[['Checks performed',fmt(totalChecks),'eye','blue'],['Uptime',pct(upt),'activity','green'],['Avg response',ms(avgMs),'clock',''],['Issues detected',fmt(issues),'shieldAlert','red']].map(k=>`<div class="card stat"><div class="stat-top"><span class="stat-l">${k[0]}</span><span class="stat-ic ${k[3]}">${I(k[2],17)}</span></div><div class="stat-v">${k[1]}</div><div class="stat-s">${lbl}</div></div>`).join('')}</div>
  <div class="grid g2 mt">
   <div class="card"><div class="card-h"><div><h3>Checks performed</h3><p>Uptime checks on websites and APIs</p></div><div class="legend"><span><i style="background:#2563ff"></i>Passed</span><span><i style="background:#ef4444"></i>Failed</span></div></div><div class="card-b">${chart('bar',{h:240,labels:L.labels,tipLabels:L.tips,series:[{name:'Passed',color:'#2563ff',data:all.map(b=>b.checks-b.fails)},{name:'Failed',color:'#ef4444',data:all.map(b=>b.fails)}]})}</div></div>
   <div class="card"><div class="card-h"><div><h3>Issues detected</h3><p>New issues and outages by severity</p></div><div class="legend"><span><i style="background:#ef4444"></i>High</span><span><i style="background:#f59e0b"></i>Medium</span><span><i style="background:#7ea3ff"></i>Low</span></div></div><div class="card-b">${chart('bar',{h:240,labels:L.labels,tipLabels:L.tips,empty:'No issues detected in this period',series:[{name:'High',color:'#ef4444',data:d.events.map(b=>b.high)},{name:'Medium',color:'#f59e0b',data:d.events.map(b=>b.medium)},{name:'Low',color:'#7ea3ff',data:d.events.map(b=>b.low)}]})}</div></div>
   <div class="card"><div class="card-h"><div><h3>Response time</h3><p>Average response time of your website${hasApi?' and API':''}</p></div><div class="legend"><span><i style="background:#2563ff"></i>Website</span>${hasApi?'<span><i style="background:#f59e0b"></i>API</span>':''}</div></div><div class="card-b">${chart('line',{h:240,labels:L.labels,tipLabels:L.tips,unit:' ms',series:[{name:'Website',color:'#2563ff',data:d.site.map(b=>b.avg_ms)}].concat(hasApi?[{name:'API',color:'#f59e0b',data:d.api.map(b=>b.avg_ms),fill:false,w:1.8}]:[])})}</div></div>
   <div class="card"><div class="card-h"><div><h3>Open issues by category</h3><p>What currently needs attention</p></div></div><div class="card-b"><div class="donut-wrap" style="min-height:240px">${donut(parts,170,22,'open issues')}<div class="donut-legend">${parts.map(p=>`<div><i style="background:${p.c}"></i>${p.n}<b>${fmt(p.v)}</b></div>`).join('')}</div></div></div></div>
  </div>
  <div class="card mt"><div class="card-h"><div><h3>Uptime</h3><p>Share of successful website checks</p></div></div><div class="card-b">${chart('line',{h:200,labels:L.labels,tipLabels:L.tips,unit:'%',axisUnit:'%',max:100,series:[{name:'Uptime',color:'#10b981',data:d.site.map(b=>b.checks?Math.round(10000*(b.checks-b.fails)/b.checks)/100:null)}]})}</div></div>`;
};

PAGES.settings=async function(){

  return `<div class="page-head"><div><h1>Settings</h1><p>Manage your account, security and notification preferences.</p></div></div>
  <div class="set-sec"><div><h2>Profile</h2><p>Your name and email address.</p></div><form class="card" data-form="profile" novalidate><div class="card-b"><div style="display:flex;align-items:center;gap:14px;margin-bottom:20px"><div class="avatar" style="width:52px;height:52px;font-size:18px">${esc(initials(u.name))}</div><div><b>${esc(u.name)}</b><div class="muted" style="font-size:13px">Member since ${new Date(u.createdAt).toLocaleDateString('en-US',{month:'long',year:'numeric'})}</div></div></div>
   <div class="grid g2" style="gap:0 16px"><div class="field"><label class="label" for="pf-name">Name</label><input class="input" id="pf-name" name="name" value="${esc(u.name)}"></div><div class="field"><label class="label" for="pf-email">Email </label><input class="input" id="pf-email" name="email" type="email" value="${esc(u.email)}"></div></div>
   ${u.emailVerified?'':`<div class="banner warn" style="margin:4px 0 0">${I('mail',16)}<div class="grow">Confirm your email to receive alerts.</div><button type="button" class="btn btn-secondary btn-sm" data-action="resendVerification">Resend email</button></div>`}</div>
   <div class="card-f"><span class="hint">Your email is only used to log in on this device.</span><button class="btn btn-primary btn-sm" type="submit"><span>Save profile</span></button></div></form></div>
  <div class="set-sec"><div><h2>Security</h2><p>Keep your Shieldly account secure.</p></div><div class="card"><div class="set-row"><div class="l"><span class="stat-ic">${I('key',16)}</span><div><b>Password</b><small>Change the password you use to log in.</small></div></div><button class="btn btn-secondary btn-sm" data-action="changePw">Change password</button></div>

function changePwModal(){
  const m=modal({title:'Change password',desc:'Use at least 8 characters. Other devices will be logged out.',icon:'key',
   body:`<form id="cp-f" novalidate><div class="field"><label class="label" for="cp-c">Current password</label><input class="input" id="cp-c" type="password" autocomplete="current-password"></div><div class="field"><label class="label" for="cp-n">New password</label><input class="input" id="cp-n" type="password" autocomplete="new-password"><div class="strength" data-s="0"><i></i><i></i><i></i><i></i></div></div><div class="field" style="margin-bottom:0"><label class="label" for="cp-r">Confirm new password</label><input class="input" id="cp-r" type="password" autocomplete="new-password"></div></form>`,
   foot:`<button class="btn btn-secondary" data-close>Cancel</button><button class="btn btn-primary" id="cp-ok"><span>Update password</span></button>`,
   onMount(el){const n=el.querySelector('#cp-n');n.addEventListener('input',()=>el.querySelector('.strength').dataset.s=pwScore(n.value));
    const submit=async()=>{const c=el.querySelector('#cp-c'),r=el.querySelector('#cp-r');let ok=true;
     if(!c.value){setErr(c,'Enter your current password.');ok=false}
     if(n.value.length<8){setErr(n,'Must be at least 8 characters.');ok=false}

async function twofaModal(input){
  let setup;try{setup=await api('POST','/me/2fa/setup')}catch(e){input.checked=false;return toastErr(e)}
  let done=false;
  const m=modal({title:'Enable two-factor authentication',desc:'Scan the QR code with an authenticator app (Google Authenticator, 1Password, Authy…), then enter the 6-digit code.',icon:'smartphone',size:'lg',
   body:`<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">${setup.qr?`<img class="qr" src="${setup.qr}" alt="QR code for your authenticator app">`:''}<div style="flex:1;min-width:200px"><label class="label" style="margin-bottom:6px">Or enter this key manually</label><div class="keybox"><code translate="no">${esc(setup.secret)}</code><button type="button" class="btn btn-ghost btn-sm btn-icon" data-action="copy" data-v="${esc(setup.secret.replace(/\s/g,''))}">${I('copy',15)}</button></div>
   <div class="field" style="margin:18px 0 0"><label class="label" for="tf-c">Verification code</label><input class="input" id="tf-c" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456" style="font-size:18px;letter-spacing:.3em"></div></div></div>`,

/* ================= Global event delegation ================= */
document.addEventListener('click',e=>{
  const ddIn=e.target.closest('.dd');if(!ddIn)closeMenus();
  const a=e.target.closest('[data-action]');
  if(a&&!a.disabled&&A[a.dataset.action]){e.preventDefault();if(a.dataset.action!=='toggleMenu'&&ddIn)closeMenus();A[a.dataset.action](a,e);return}
  const g=e.target.closest('[data-go]');if(g&&!g.disabled){e.preventDefault();$('.nav')&&$('.nav').classList.remove('open');go(g.dataset.go)}
});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  ({signup:submitSignup,login:submitLogin,twofa:submitTwofa,forgot:submitForgot,reset:submitReset,onb1:f=>submitOnb(1,f),onb2:f=>submitOnb(2,f),onb3:f=>submitOnb(3,f),profile:saveProfile,restorePro:submitRestorePro}[f.dataset.form]||(()=>{}))(f)});
const searchDebounced=debounce(()=>renderActivityTable(),300);
document.addEventListener('input',e=>{
  if(e.target.id==='su-pw'){const s=$('#pw-str');s&&(s.dataset.s=pwScore(e.target.value))}
  if(e.target.id==='af-q'){actF.q=e.target.value;actF.page=1;searchDebounced()}
});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.id==='af-sev'){actF.sev=t.value;actF.page=1;renderActivityTable()}
  if(t.id==='af-site'){actF.site=t.value;actF.page=1;renderActivityTable()}
  if(t.id==='an-site'){anSite=t.value;renderPage(true)}
  const k=t.dataset.change;if(!k)return;
  if(k==='setting'){if(t.dataset.k==='emailAlerts'&&t.checked&&window.Notification&&Notification.permission==='default')Notification.requestPermission().then(()=>renderPage(true));try{const d=await api('PATCH','/me/settings',{[t.dataset.k]:t.checked});S.user=d.user;toast(t.checked?'Notifications enabled':'Notifications disabled',t.closest('.set-row').querySelector('b').textContent,'success',2200)}catch(err){t.checked=!t.checked;toastErr(err)}}
  if(k==='twofa'){if(t.checked)twofaModal(t);else{const ok=await confirmDialog({title:'Disable two-factor authentication?',text:'Your account will be less secure without a second verification step.',confirm:'Disable 2FA',danger:true,requirePassword:async pw=>{const d=await api('POST','/me/2fa/disable',{password:pw});S.user=d.user}});if(ok){toast('Two-factor authentication disabled','','warn');renderPage(true)}else t.checked=true}}
  if(k==='siteStatus'){const s=S.sites.find(x=>x.id===protSite);if(!s)return;try{await api('PATCH','/sites/'+s.id,{status:t.checked?'active':'paused'});toast(t.checked?'Monitoring resumed':'Monitoring paused',s.domain,t.checked?'success':'warn');renderPage(true)}catch(err){t.checked=!t.checked;toastErr(err)}}
});
document.addEventListener('mousemove',e=>{const f=e.target.closest&&e.target.closest('.feature');if(f){const r=f.getBoundingClientRect();f.style.setProperty('--mx',(e.clientX-r.left)+'px');f.style.setProperty('--my',(e.clientY-r.top)+'px')}},{passive:true});

async function saveProfile(f){const n=f.name,e=f.email;let ok=true;
  if(n.value.trim().length<2){setErr(n,'Please enter your name.');ok=false}
  if(!isEmail(e.value)){setErr(e,'Please enter a valid email.');ok=false}
  if(!ok)return;const b=f.querySelector('[type=submit]');btnLoad(b,true);
  try{const changed=e.value.trim().toLowerCase()!==S.user.email;const d=await api('PATCH','/me',{name:n.value,email:e.value});S.user=d.user;updateShell();toast('Profile saved',changed?'Check your inbox to confirm your new email.':'');renderPage(true)}
  catch(err){btnLoad(b,false);if(err.status===409)setErr(e,err.message);else toastErr(err)}}

const LANGS=[['en','English'],['nl','Nederlands'],['de','Deutsch'],['fr','Français'],['es','Español'],['it','Italiano'],['pt','Português'],['pl','Polski'],['tr','Türkçe'],['ar','العربية'],['ru','Русский'],['uk','Українська'],['hi','हिन्दी'],['id','Bahasa Indonesia'],['zh-CN','中文 (简体)'],['ja','日本語'],['ko','한국어']];
let gtLoading=null;
function loadGT(){if(gtLoading)return gtLoading;gtLoading=new Promise((res,rej)=>{window.__gtInit=function(){try{new google.translate.TranslateElement({pageLanguage:'en',autoDisplay:false},'gt-el');res()}catch(e){rej(e)}};
  const sc=document.createElement('script');sc.src='https://translate.google.com/translate_a/element.js?cb=__gtInit';sc.onerror=()=>{gtLoading=null;rej(new Error('Translation service could not be loaded. Check your internet connection.'))};document.head.appendChild(sc)});return gtLoading}
async function applyLang(code,quiet){
  if(code==='en'){const was=lsGet('shieldly.lang','en');lsSet('shieldly.lang','en');document.cookie='googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/';if(was!=='en')location.reload();return}
  lsSet('shieldly.lang',code);
  try{await loadGT();let sel=null;for(let i=0;i<40&&!(sel=document.querySelector('.goog-te-combo'));i++)await sleep(150);
    if(!sel)throw new Error('Translation service is not available right now.');sel.value=code;sel.dispatchEvent(new Event('change'))}
  catch(e){if(!quiet)toast('Translation not available',e.message,'error');lsSet('shieldly.lang','en');syncLangSelect()}
}
function syncLangSelect(){const v=lsGet('shieldly.lang','en');$$('.lang-select').forEach(s=>s.value=v)}
(function mountLang(){
  const box=document.createElement('div');box.className='lang-float notranslate';box.setAttribute('translate','no');
  box.innerHTML=`<label class="lang-pill" title="Translate this page">${I('globe',16)}<select class="lang-select" aria-label="Language">${LANGS.map(l=>`<option value="${l[0]}">${l[1]}</option>`).join('')}</select>${I('chevDown',14)}</label><div id="gt-el" style="display:none"></div>`;
  document.body.appendChild(box);
  document.addEventListener('change',e=>{if(e.target.classList&&e.target.classList.contains('lang-select')){const v=e.target.value;$$('.lang-select').forEach(s=>s.value=v);applyLang(v)}});
  syncLangSelect();const saved=lsGet('shieldly.lang','en');if(saved!=='en')setTimeout(()=>applyLang(saved,true),300);
})();

/* ================= Boot ================= */
(async function boot(){
  try{const d=await api('GET','/me');S.user=d.user;await refreshSites()}catch(e){S.user=null}
  S.booted=true;render();
})();
})();

</script>
</body>
