# Shieldly on Netlify — everything lives in the main folder:
# - website: index.html
# - payment + 24/7 code: license.mjs, monitor.mjs, stripe-webhook.mjs, paypal-webhook.mjs
[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "."
  node_bundler = "esbuild"

# Never serve the source/config files as web pages
[[redirects]]
  from = "/netlify/*"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/license.mjs"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/monitor.mjs"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/stripe-webhook.mjs"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/paypal-webhook.mjs"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/package-lock.json"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/LEESMIJ.md"
  to = "/"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
